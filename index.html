<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dfe5ef">
  <title>Embossed Loader Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Embossed Loader Animation</h1>
    </header>

    <section class="loader-list" id="loaderList" aria-label="Embossed loader demonstrations">
      <article class="loader-card">
        <h2>THE CHASER TRACK</h2>
        <div class="demo-stage">
          <div class="loader-runner" aria-label="Chaser track loader">
            <span class="runner-dot"></span>
          </div>
        </div>
        <div class="code-panel">
          <div class="code-top"><span>HTML + CSS</span><button class="copy-code" type="button">Copy CSS</button></div>
          <pre><code class="source-code" data-code="chaser"></code></pre>
        </div>
      </article>

      <article class="loader-card">
        <h2>THE MORPHING DROPLET</h2>
        <div class="demo-stage">
          <div class="loader-morph" aria-label="Morphing droplet loader"></div>
        </div>
        <div class="code-panel">
          <div class="code-top"><span>HTML + CSS</span><button class="copy-code" type="button">Copy CSS</button></div>
          <pre><code class="source-code" data-code="morph"></code></pre>
        </div>
      </article>

      <article class="loader-card">
        <h2>THE HYDRAULIC PRESS WAVE</h2>
        <div class="demo-stage">
          <div class="loader-wave" aria-label="Hydraulic press wave loader">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="code-panel">
          <div class="code-top"><span>HTML + CSS</span><button class="copy-code" type="button">Copy CSS</button></div>
          <pre><code class="source-code" data-code="wave"></code></pre>
        </div>
      </article>

      <article class="loader-card">
        <h2>THE ACCENT PING</h2>
        <div class="demo-stage">
          <div class="loader-ping" aria-label="Accent ping loader"></div>
        </div>
        <div class="code-panel">
          <div class="code-top"><span>HTML + CSS</span><button class="copy-code" type="button">Copy CSS</button></div>
          <pre><code class="source-code" data-code="ping"></code></pre>
        </div>
      </article>

      <article class="loader-card">
        <h2>THE METALLIC ANGLE DIAL</h2>
        <div class="demo-stage">
          <div class="loader-dial" aria-label="Metallic angle dial loader"></div>
        </div>
        <div class="code-panel">
          <div class="code-top"><span>HTML + CSS</span><button class="copy-code" type="button">Copy CSS</button></div>
          <pre><code class="source-code" data-code="dial"></code></pre>
        </div>
      </article>
    </section>
    <footer>FIVE EMBOSSED LOADER EFFECTS · PURE HTML, CSS &amp; JAVASCRIPT</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
